{% extends "base.html" %}

{% block content %}
<h1>Users</h1>

<ul class="user-list">
    {% for user in users %}
        <li class="user-entry">
            <a
                href="{{ url_for('get_movies', user_id=user.id) }}"
                class="btn"
            >
                {{ user.name }}
            </a>
        </li>
    {% else %}
        <li>No users found.</li>
    {% endfor %}
</ul>

<form action="{{ url_for('create_user') }}" method="post">
    <label for="name">Name</label>
    <input
        id="name"
        type="text"
        name="name"
        placeholder="Name"
        required
    >
    <button type="submit">Create</button>
</form>
{% endblock %}

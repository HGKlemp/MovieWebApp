{% extends "base.html" %}

{% block content %}
<section class="page-heading">
    <div>
        <p class="eyebrow">Step 1</p>
        <h1>Choose a user</h1>
        <p>Open a profile to view and rate its movies.</p>
    </div>
</section>

<section class="panel">
    <h2>Profiles</h2>
    <ul class="user-list">
        {% for user in users %}
            <li class="user-entry">
                <a href="{{ url_for('get_movies', user_id=user.id) }}" class="btn btn-secondary">
                    {{ user.name }}
                </a>
            </li>
        {% else %}
            <li class="empty-state">No users yet. Create the first profile below.</li>
        {% endfor %}
    </ul>
</section>

<section class="panel form-panel">
    <h2>Create a profile</h2>
    <form class="inline-form" action="{{ url_for('create_user') }}" method="post">
        <div class="field">
            <label for="name">Name</label>
            <input id="name" type="text" name="name" placeholder="e.g. Alex" required>
        </div>
        <button type="submit">Create profile</button>
    </form>
</section>
{% endblock %}
